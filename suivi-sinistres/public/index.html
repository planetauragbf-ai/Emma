{n:'Information client',to:'client',step:0,subj:'Votre commande {cmd} – incident de transport (dossier {num})',body:`Bonjour,\n\nNous avons été informés d’un incident de transport concernant votre commande {cmd} : {type}, {nb} bouteille(s) concernée(s), expédiée avec {carr} (suivi {track}).\n\nNous avons ouvert le dossier {num} et engagé les démarches auprès du transporteur et de notre assureur. Nous reviendrons vers vous rapidement avec une solution (réexpédition ou remboursement).`+SG,subjEn:'Your order {cmd} – transport incident (case {num})',bodyEn:`Hello,\n\nWe have been informed of a transport incident concerning your order {cmd}: {typeEn}, {nb} bottle(s) affected, shipped with {carr} (tracking {track}).\n\nWe have opened case {num} and started the necessary steps with the carrier and our insurer. We will come back to you shortly with a solution (reshipment or refund).`+SGE},
{n:'Information domaine',to:'adh',step:0,subj:'[SINISTRE] {cmd} {client} {track}',body:`Bonjour,\n\nUn incident de transport est survenu sur la commande {cmd} de {client} ({type}, {nb} bouteille(s), transporteur {carr}, suivi {track}).\n\nEn accord avec la requête de votre client, serait-il possible de procéder à une RXP / un remboursement ? Merci de nous transmettre {facture}.\n\nJ’ai ajouté notre assureur en copie afin qu’il puisse vous solliciter directement si des informations complémentaires sont nécessaires au traitement du dossier.`+SG,subjEn:'[CLAIM] {cmd} {client} {track}',bodyEn:`Hello,\n\nA transport incident occurred on order {cmd} for {client} ({typeEn}, {nb} bottle(s), carrier {carr}, tracking {track}).\n\nAs requested by your customer, could we proceed with a reshipment / a refund? Please send us an invoice for the affected wines.\n\nI have copied our insurer so that they can contact you directly if further information is needed to process the case.`+SGE},
{n:'Client · Casse partielle – réexpédition ou remboursement (≥ seuil)',to:'client',step:0,subj:'Commande n° {cmd}',body:`Bonjour {client},\n\nNous espérons que ce message vous trouve bien.\n\nLe transporteur nous a informés qu’une partie de votre commande a été endommagée pendant le transport. Les bouteilles restantes sont en bon état et poursuivent leur route vers l’adresse de livraison indiquée.\n\nIl se peut que les bouteilles restantes soient retournées dans notre entrepôt de New York avant réexpédition.\n\nPour régler la situation, nous vous proposons les solutions suivantes :\n\n- Réexpédition des bouteilles manquantes (sous réserve de leur disponibilité au domaine) : merci de nous confirmer votre disponibilité à l’adresse de livraison initiale ou de nous communiquer une nouvelle adresse.\n\n- Remboursement des bouteilles manquantes, ainsi qu’un remboursement au prorata des frais de transport.\n\nLe cas échéant, pourriez-vous nous confirmer quelles bouteilles vous avez reçues ?\n\nDites-nous si vous souhaitez que nous expédiions les bouteilles restantes et confirmez l’adresse de livraison. Nous ferons le nécessaire dès réception de votre confirmation.\n\nDans l’attente de votre retour.`+SG,subjEn:'Order #{cmd}',bodyEn:`Hello {client},\n\nI hope this message reaches you safely.\n\nWe have been informed by the carrier that part of your order was damaged in transit. The remaining bottles are in good condition and on their way to the provided delivery address.\n\nThe remaining bottles may be returned to our warehouse in NY prior to reshipment to you.\n\nTo resolve the situation, we propose the following solutions:\n\n- Reshipment of the missing bottles (subject to their availability at the winery): please confirm your availability at the delivery address on file, or provide us with a new delivery address.\n\n- Reimbursement of the missing bottles, as well as a pro-rata reimbursement of transport costs.\n\nIf applicable, could you please confirm which bottles you have received?\n\nPlease let us know if you wish us to ship the remaining bottles and confirm the delivery address. We will take the necessary steps as soon as we receive your confirmation.\n\nWe look forward to receiving your reply.`+SGE},
{n:'Client · Casse partielle – remboursement (< seuil)',to:'client',step:0,subj:'Commande n° {cmd}',body:`Bonjour {client},\n\nNous espérons que ce message vous trouve bien.\n\nLe transporteur nous a informés qu’une partie de votre commande a été endommagée pendant le transport. Les bouteilles restantes sont en bon état et poursuivent leur route vers l’adresse de livraison indiquée.\n\nIl se peut que les bouteilles restantes soient retournées dans notre entrepôt de New York avant réexpédition.\n\nPour régler la situation, nous vous proposons le remboursement des bouteilles manquantes, ainsi qu’un remboursement au prorata des frais de transport.\n\nLe cas échéant, pourriez-vous nous confirmer quelles bouteilles vous avez reçues ?\n\nDites-nous si cette solution vous convient. Nous ferons le nécessaire dès réception de votre confirmation.\n\nDans l’attente de votre retour.`+SG,subjEn:'Order #{cmd}',bodyEn:`Hello {client},\n\nI hope this message reaches you safely.\n\nWe have been informed by the carrier that part of your order was damaged in transit. The remaining bottles are in good condition and on their way to the provided delivery address.\n\nThe remaining bottles may be returned to our warehouse in NY prior to reshipment to you.\n\nTo resolve this situation, we propose a reimbursement of the missing bottles, as well as a pro-rata reimbursement of transport costs.\n\nIf applicable, could you please confirm which bottles you have received?\n\nPlease let us know if that works for you. We will take the necessary steps as soon as we receive your confirmation.\n\nWe look forward to receiving your reply.`+SGE},
{n:'Client · Casse totale – réexpédition ou remboursement (≥ seuil)',to:'client',step:0,subj:'Commande n° {cmd}',body:`Bonjour {client},\n\nNous espérons que ce message vous trouve en bonne forme.\n\nLe transporteur nous a informés que votre colis a été endommagé et totalement détruit pendant le transport. Nous sommes sincèrement désolés de cet incident et souhaitons vous proposer les solutions suivantes :\n\n- Remboursement intégral des bouteilles et des frais de transport.\n\n- Réexpédition de votre commande sans frais supplémentaires (sous réserve de la disponibilité des vins au domaine).\n\nMerci de nous indiquer l’option qui vous convient afin que nous puissions faire le nécessaire.\n\nDans l’attente de votre retour.`+SG,subjEn:'Order #{cmd}',bodyEn:`Hello {client},\n\nI hope this message reaches you in good condition.\n\nWe have been informed by the carrier that your parcel has been damaged and completely destroyed in transit. We are sincerely sorry for this incident and would like to offer you the following solutions to remedy the situation:\n\n- Full refund of the bottles and shipping costs.\n\n- Reshipment of your order at no extra cost (subject to availability of the wines at the winery).\n\nPlease let us know which option suits you best so that we can make the necessary arrangements.\n\nWe look forward to receiving your reply.`+SGE},
{n:'Client · Casse totale – remboursement (< seuil)',to:'client',step:0,subj:'Commande n° {cmd}',body:`Bonjour {client},\n\nNous espérons que ce message vous trouve en bonne forme.\n\nLe transporteur nous a informés que votre colis a été endommagé et totalement détruit pendant le transport. Nous sommes sincèrement désolés de cet incident et souhaitons vous proposer le remboursement intégral des bouteilles et des frais de transport.\n\nMerci de nous indiquer si cette solution vous convient et de nous communiquer une adresse e-mail PayPal pour le remboursement.\n\nDans l’attente de votre retour.`+SG,subjEn:'Order #{cmd}',bodyEn:`Hello {client},\n\nI hope this message reaches you in good condition.\n\nWe have been informed by the carrier that your parcel has been damaged and completely destroyed in transit. We are sincerely sorry for this incident and would like to offer you a full refund of the bottles and shipping costs.\n\nPlease let us know if that works for you and provide a PayPal email address for the refund.\n\nWe look forward to receiving your reply.`+SGE},
{n:'Client · Perte partielle – réexpédition ou remboursement (≥ seuil)',to:'client',step:0,subj:'Commande n° {cmd}',body:`Bonjour {client},\n\nNous espérons que ce message vous trouve bien.\n\nLe transporteur nous a informés qu’une partie de votre commande a malheureusement été perdue pendant le transport. Nous vous présentons nos sincères excuses et souhaitons vous proposer les solutions suivantes :\n\n- Réexpédition des bouteilles perdues, sous réserve de leur disponibilité au domaine.\n\n- Remboursement des bouteilles perdues ainsi qu’un remboursement au prorata des frais de transport.\n\nPour traiter votre dossier, pourriez-vous nous confirmer quelles bouteilles vous avez reçues ? Cela nous permettra d’organiser la réexpédition ou de procéder au remboursement au plus vite.\n\nDans l’attente de votre retour, nous restons à votre écoute pour toute question.`+SG,subjEn:'Order #{cmd}',bodyEn:`Hello {client},\n\nI hope this message finds you well.\n\nWe have been informed by the carrier that part of your order was unfortunately lost during transport. We sincerely apologize for this incident and would like to offer you the following solutions:\n\n- Reshipment of the lost bottles, subject to their availability at the winery.\n\n- Refund of the lost bottles as well as a prorated refund of the shipping costs.\n\nTo process your case, could you please confirm which bottles you have received? This will allow us to arrange the reshipment or proceed with the refund as quickly as possible.\n\nWe look forward to hearing from you and remain at your disposal should you have any questions.`+'\n\nYours sincerely,\n{sig}'},
{n:'Client · Perte partielle – remboursement (< seuil)',to:'client',step:0,subj:'Commande n° {cmd}',body:`Bonjour {client},\n\nNous espérons que ce message vous trouve bien.\n\nLe transporteur nous a informés qu’une partie de votre commande a malheureusement été perdue pendant le transport. Nous vous présentons nos sincères excuses et souhaitons vous rembourser les bouteilles perdues ainsi qu’une partie des frais de transport, au prorata.\n\nPour traiter votre dossier, pourriez-vous nous confirmer quelles bouteilles vous avez reçues ?\n\nDans l’attente de votre retour, nous restons à votre écoute pour toute question.`+SG,subjEn:'Order #{cmd}',bodyEn:`Hello {client},\n\nI hope this message finds you well.\n\nWe have been informed by the carrier that part of your order was unfortunately lost during transport. We sincerely apologize for this incident and would like to refund the lost bottles as well as a prorated refund of the shipping costs.\n\nTo process your case, could you please confirm which bottles you have received?\n\nWe look forward to hearing from you and remain at your disposal should you have any questions.`+'\n\nYours sincerely,\n{sig}'},
{n:'Client · Perte totale – réexpédition ou remboursement (≥ seuil)',to:'client',step:0,subj:'Commande n° {cmd}',body:`Bonjour {client},\n\nNous espérons que ce message vous trouve bien.\n\nLe transporteur nous a informés que votre colis a malheureusement été perdu pendant le transport. Nous sommes sincèrement désolés de cet incident et souhaitons vous proposer les solutions suivantes :\n\n- Remboursement intégral des bouteilles et des frais de transport.\n\n- Réexpédition de votre commande sans frais supplémentaires (sous réserve de la disponibilité des vins au domaine).\n\nMerci de nous indiquer l’option qui vous convient afin que nous puissions faire le nécessaire.\n\nDans l’attente de votre retour.`+SG,subjEn:'Order #{cmd}',bodyEn:`Hello {client},\n\nI hope this message reaches you safely.\n\nWe have been informed by the carrier that your parcel has unfortunately been lost in transit. We are sincerely sorry for this incident and would like to offer you the following solutions to remedy the situation:\n\n- Full refund of the bottles and transport costs.\n\n- Reshipment of your order at no extra cost (subject to availability of the wines at the winery).\n\nPlease let us know which option suits you best so that we can make the necessary arrangements.\n\nWe look forward to hearing from you.`+SGE},
{n:'Client · Perte totale – remboursement (< seuil)',to:'client',step:0,subj:'Commande n° {cmd}',body:`Bonjour {client},\n\nNous espérons que ce message vous trouve bien.\n\nLe transporteur nous a informés que votre colis a malheureusement été perdu pendant le transport. Nous sommes sincèrement désolés de cet incident et souhaitons vous rembourser intégralement les bouteilles et les frais de transport.\n\nMerci de nous indiquer si cette solution vous convient et de nous communiquer une adresse e-mail PayPal pour le remboursement.\n\nDans l’attente de votre retour.`+SG,subjEn:'Order #{cmd}',bodyEn:`Hello {client},\n\nI hope this message reaches you safely.\n\nWe have been informed by the carrier that your parcel has unfortunately been lost in transit. We are sincerely sorry for this incident and would like to offer a full refund of the bottles and transport costs.\n\nPlease let us know if that works for you and provide a PayPal email address for the refund.\n\nWe look forward to receiving your reply.`+SGE},
{n:'Réclamation transporteur',to:'carr',step:1,subj:'Déclaration de sinistre – [N° de suivi {track}] – [Référence {cmd}]',body:`Bonjour,\n\nNous souhaitons déclarer un sinistre concernant l’envoi {track}, référence {cmd}, expédié le {exp} vers {pays}.\n\nNature du sinistre : {nature}.\n\nNous ne pouvons pas effectuer cette déclaration depuis votre interface en ligne. Pourriez-vous ouvrir le dossier de réclamation pour nous et nous communiquer son numéro ?\n\nDétail du préjudice :\n\n- Désignation : {desc}\n- Bouteilles : {pBtl}\n- Transport : {pTr}\n- Droits et taxes : {pTaxe}\n- Préjudice total : {prej}\n\nDescription du colis : [carton de 6 ou 12 bouteilles, type de calage utilisé, état à la réception].\n\nVous trouverez en pièces jointes la facture correspondante, les photos du colis et des bouteilles, la capture du suivi, ainsi que le bon de transport.\n\nPourriez-vous nous confirmer l’ouverture du dossier et nous indiquer le délai de traitement ainsi que le montant de l’indemnisation prévue ?\n\nMerci par avance pour votre retour.\n\nBien cordialement,\n{sig}`,subjEn:'Claim declaration – [Tracking no. {track}] – [Reference {cmd}]',bodyEn:`Hello,\n\nWe would like to declare a claim regarding shipment {track}, reference {cmd}, shipped on {exp} to {pays}.\n\nNature of the claim: {natureEn}.\n\nWe are unable to file this claim from your online interface. Could you please open the claim file for us and let us know its number?\n\nDetail of the loss:\n\n- Description: {desc}\n- Bottles: {pBtl}\n- Transport: {pTr}\n- Duties and taxes: {pTaxe}\n- Total loss: {prej}\n\nParcel description: [carton of 6 or 12 bottles, type of packaging used, condition on receipt].\n\nPlease find attached the related invoice, photos of the parcel and bottles, the tracking screenshot and the shipping label.\n\nCould you please confirm that the claim has been opened and let us know the processing time and the expected compensation amount?\n\nThank you in advance for your reply.\n\nBest regards,\n{sig}`},
{n:'Déclaration Coste Fermon',to:'cf',step:2,subj:'Déclaration de sinistre : ID {cmd} – {client}',body:`Bonjour Isabelle et Céline,\n\nJ’espère que vous allez bien.\n\nVeuillez trouver ci-dessous notre déclaration de sinistre.\n\nRéférence Planet Aura : {cmd}\n\nNom et prénom du destinataire : {client}\n\nNuméro de suivi : {track}\n\nDestination : {pays}\n\nTransporteur : {carr}\n\nType de sinistre : {typeS}\n\nDate de constat : {constat}\n\nBouteilles concernées : {nb} · Magnums concernés : {mag}\n\nPréjudice bouteilles : {pBtl} HT\nPréjudice transport : {pAut} HT\nPréjudice taxes : {pTaxe}\nPréjudice total : {prej} HT\n\nDescription : {desc}\n\nMoment du sinistre : durant le transport entre nos locaux de New York et le destinataire final.\n\nDossier avec pièces sinistre : consultable dans votre espace privé Planet Aura (dossier {num}). Pièces prêtes pour votre instruction : {docs}.\n\nInformez-nous s’il vous manque des informations ou des documents.`+'\n\nBien cordialement,\n{sig}',subjEn:'Claim declaration: ID {cmd} – {client}',bodyEn:`Hello Isabelle and Céline,\n\nI hope you are well.\n\nPlease find below our claim declaration.\n\nPlanet Aura reference: {cmd}\n\nRecipient name: {client}\n\nTracking number: {track}\n\nDestination: {pays}\n\nCarrier: {carr}\n\nType of claim: {typeSE}\n\nDate of finding: {constat}\n\nBottles affected: {nb} · Magnums affected: {mag}\n\nBottles loss: {pBtl} excl. VAT\nTransport loss: {pAut} excl. VAT\nTaxes loss: {pTaxe}\nTotal loss: {prej} excl. VAT\n\nDescription: {desc}\n\nTime of the incident: during transport between our New York premises and the final recipient.\n\nClaim file with supporting documents: available in your private Planet Aura space (case {num}). Documents ready for your review: {docs}.\n\nPlease let us know if any information or documents are missing.`+'\n\nBest regards,\n{sig}'},
{n:'Demande de facture au domaine',to:'adh',step:5,subj:'Sinistre ID {cmd} - {client}',body:`Bonjour,\n\nLa commande de {client} a malheureusement été {incident} lors du transport.\n\nLe client a la possibilité de choisir entre une réexpédition de sa commande ou un remboursement. Voici les modalités de prise en charge selon l’option retenue :\n\n- En cas de réexpédition : nous prenons en charge le remboursement des bouteilles à renvoyer, sur présentation d’une facture HT établie au nom de Planet Aura, hors frais de transport. En effet, nous prenons directement en charge les frais d’expédition de la nouvelle commande.\n\n- En cas de remboursement : nous remboursons directement le client du montant des bouteilles concernées ainsi que des frais de transport, au prorata du nombre de bouteilles cassées ou endommagées.\n\nPour ce sinistre, le client ayant opté pour une réexpédition, nous vous remercions de bien vouloir nous transmettre une facture HT correspondant aux vins concernés :\n\nDétail des bouteilles : {desc}\n\nPourriez-vous également nous indiquer à quelle date vous souhaiteriez organiser le départ de la réexpédition, en fonction de la disponibilité des bouteilles ?\n\nNous vous remercions par avance pour votre retour.`+'\n\nBien cordialement,\n{sig}',subjEn:'Claim ID {cmd} - {client}',bodyEn:`Hello,\n\nThe order of {client} was unfortunately {incidentEn} during transport.\n\nThe customer can choose between a reshipment of the order or a refund. Here is how we handle each option:\n\n- Reshipment: we reimburse the bottles to be sent again, on presentation of an invoice excluding VAT issued to Planet Aura, excluding transport costs, since we directly bear the shipping costs of the new order.\n\n- Refund: we directly refund the customer for the affected bottles and the transport costs, pro rata to the number of broken or damaged bottles.\n\nFor this claim, the customer has opted for a reshipment, so please send us an invoice excluding VAT for the wines concerned:\n\nBottle details: {desc}\n\nCould you also let us know on which date you would like to organise the departure of the reshipment, depending on the availability of the bottles?\n\nThank you in advance for your reply.`+'\n\nBest regards,\n{sig}'}];

else el.innerHTML=`<h2>Guide</h2><div class="gd"><h2 style="font-size:20px">Guide du logiciel</h2><h3>À quoi sert cet outil</h3><p>Suivre chaque sinistre transport de l’ouverture au remboursement, savoir quelle est la prochaine action, partager ce qu’il faut avec Coste Fermon, et garder la trace de tout (e-mails, documents, modifications, remboursements).</p>
<h3>Se repérer</h3><p>Le menu est à gauche, comme dans Planet’Connect : rubrique <b>Planet’Claim</b> (Tableau de bord, Déclarations, Sinistres, Relances, Documents, Remboursements, Balancier, Historique), et <b>Administration</b> (Planet’Claim pour les réglages, Guide). Les onglets « Déclarations », « Relances » et « Remboursements » s’appelaient avant « Potentiel sinistre », « À faire » et « Compta » (le nom « Comptabilité » est déjà pris dans Planet’Connect). En haut à droite : Exporter en CSV, Nouveau ticket et votre nom (« Bonjour … »). Le bouton « ← Retour » revient à la fiche ou à l’onglet précédent. Chacun ne voit que les onglets autorisés pour lui. Le numéro de version est en bas du menu : si une modification n’apparaît pas, fermez les autres onglets de la page et rechargez.</p>
<h3>Potentiel sinistre (déclarations des clients)</h3><p>Chaque déclaration reçue du formulaire client arrive en « Reçu », puis « En analyse ». Trois statuts : <b>À traiter</b> (Reçu ou En analyse), <b>Ticket créé</b> et <b>Clos sans ticket</b>. Dans la liste, le bouton <b>Clôturer</b> propose :</p><ul><li><b>Clore sans ticket</b> avec un motif (${esc(POTMOT.join(', '))}) ; « Ticket déjà créé » rattache la déclaration à un dossier existant ;</li><li><b>Clore et ouvrir un ticket</b> : vous arrivez directement dans Sinistres avec le formulaire prérempli.</li></ul><p>Créer un ticket demande une double validation : rien n’est enregistré avant la confirmation. Dès qu’un ticket correspond à la déclaration, elle passe seule en « Ticket créé ». Le statut et le motif se modifient aussi dans la déclaration, avec enregistrement automatique. Les motifs se modifient dans Paramètres.</p>
<h3>Les ${STEPS.length} étapes d’un sinistre</h3><ul>${STEPS.map((s,i)=>`<li><b>${s}</b> : ${HELP[i]}</li>`).join('')}</ul><p>Couleurs : <b style="color:var(--done)">vert</b> = fait, <b style="color:var(--wip)">orange</b> = en cours, <b style="color:var(--ko)">rouge</b> = refusé ou non transmis, gris foncé = sans objet, gris clair = à faire. Chaque étape se coche dans la fiche ; les actions se rattachent à l’étape et à un acteur (Planet Aura, client, domaine, transporteur, Coste Fermon) et entrent dans l’historique à leur validation.</p>
<h3>La fiche d’un sinistre</h3><p>Le bouton Plein écran agrandit la fiche. Rien n’est enregistré tant que vous n’avez pas cliqué sur « Enregistrer » (« Annuler » remet l’état précédent). Les statuts « ${esc(CLOS.join(' », « '))} » ferment le dossier (date de clôture automatique). Le <b>préjudice</b> additionne bouteilles, transport et taxes ; reste à charge = remboursement client + rachat adhérent − recours transporteur − indemnité CF + prime CF − prime client (perte estimée sur le préjudice si aucun remboursement n’est saisi). Le bandeau du haut garde la référence visible quand vous faites défiler. Dans Transport : transporteur, suivi, <b>réf. Weship (si applicable)</b>, indemnisation, et le remboursement reçu avec sa date. Le lieu de livraison se renseigne dans l’étape Réclamation transporteur et sert de filtre.</p>
<h3>Ticket depuis Planet Connect</h3><p>Le bouton Nouveau ticket accepte les informations copiées depuis l’onglet shipping. Les informations manquantes clignotent dans la fiche et la liste jusqu’à ce qu’elles soient renseignées. Chaque dossier porte un pays et une zone (UE, Pays tiers, USA first mile ou last mile) pour filtrer et regrouper.</p>
<h3>Relances et rappels</h3><p>Cochez « Relance » en saisissant une action, ou envoyez un e-mail de relance : la dernière relance est mise à jour et un rappel est planifié (délai réglable dans Paramètres). L’onglet À faire classe les dossiers par échéance et indique qui relancer.</p>
<h3>E-mails</h3><p>Depuis une fiche, choisissez un modèle puis « Écrire un e-mail ». « Envoyer via Gmail » utilise la messagerie de la personne connectée ; chaque envoi est enregistré (date, destinataires, objet, texte, auteur) et l’étape passe en « En cours ». Pour un e-mail à Coste Fermon, le message liste les documents cochés « visible par Coste Fermon » et un lien mène à l’onglet Documents pour les modifier avant d’écrire.</p>
<h3>Documents</h3><p>Dans chaque fiche (section Pièces du sinistre) ou dans l’onglet Documents, déposez des PDF ou images, plusieurs à la fois. Dans l’onglet Documents, chaque sinistre est une ligne repliée : ouvrez-la pour voir les pièces, cliquez sur un nom pour l’ouvrir, cochez <b>« visible CF »</b> pour celles que Coste Fermon peut voir, puis cliquez sur <b>Enregistrer</b> (« Annuler » abandonne). Il n’y a plus de bibliothèque générale : les modèles, procédures et leurs fichiers se rangent dans <b>Guide › Process internes</b>, avec la même case « visible par Coste Fermon ». Les anciens liens Drive restent accessibles.</p>
<h3>Coste Fermon : espace privé</h3><p>Invitez Coste Fermon avec le menu Partager en « Lecteur ». Il voit seulement les dossiers partagés, les informations cochées dans Paramètres et les documents marqués visibles, en lecture seule, et peut vous écrire depuis son espace. Le partage d’un dossier est <b>automatique</b> dès que la déclaration Coste Fermon est faite (date de déclaration saisie ou étape lancée) ; la case est dans la section Coste Fermon de la fiche, et décocher la retire durablement. Dans Paramètres, l’option <b>Accès documents seulement</b> retire tous les dossiers de son espace et ne lui laisse que les documents cochés.</p>
<h3>Compta : remboursements</h3><p>Un sinistre apparaît dans l’onglet Compta dès qu’une étape de remboursement passe « En cours » : 5 (remboursement client) et 6 (rachat adhérent, facture domaine) quand un montant est prévu dans la fiche (montant et base du calcul dans les blocs des étapes 5 et 6), 7 (transporteur) ou 8 (Coste Fermon) ; la date de passage en cours est posée automatiquement. La compta y renseigne, pour chaque remboursement : le montant, la date, la date de dernière relance, des références (avoir, note de crédit, virement, chèque, facture, autre, avec numéro et date) et un commentaire, puis clique sur « Enregistrer ». Une ligne du temps affiche les dates clés (en cours, relances, pièces, remboursement, fin d’étape) et le nombre de jours en cours. Deux présentations : <b>Fiches</b> (une ligne repliée par sinistre) et <b>Tableau</b> (une ligne par sinistre, saisie rapide, les plus anciens en premier). La même saisie est disponible dans les étapes 5 à 8 de la fiche, et reporte le montant et la date dans les champs correspondants. Le bouton « Statistiques » (si le droit est accordé) donne la trésorerie par mois de paiement. Le profil « Comptabilité » ne donne accès qu’à cet onglet.</p>
<h3>Balancier</h3><p>Onglet à accès paramétrable (réservé à vous par défaut). <b>Balancier</b> : tableau mensuel (assurance facturée, facture CF calculée à 1 % de la marchandise + 15 % hors UE, marge, remboursements, recours, indemnités, coût net, résultat), export CSV ou Excel. Chaque mois, importez dans Déclaration mensuelle l’export des assurances envoyé à CF : la facture CF est calculée sur les lignes qui correspondent à un sinistre (numéro de shipping), avec un contrôle contre le calcul des fiches, puis une déclaration annuelle. Les anciennes déclarations saisies à la main sont ignorées. <b>Reste à charge</b> (+ gain, − perte) : par dossier, par mois et en statistiques ; le filtre « Perte estimée » liste les dossiers où aucun remboursement n’est saisi ; les dossiers critiques sont signalés (reste à charge élevé, non assuré avec perte, recours en retard ou absent).</p><h3>Historique</h3><p>L’onglet Historique est organisé par sinistre : une ligne par référence, à déplier pour voir chaque modification, e-mail, document, saisie compta et événement de la déclaration rattachée, avec date et auteur. Une recherche permet de retrouver une référence ou un mot.</p>
<h3>Droits de l’équipe</h3><p>Invitez chaque collègue en « Contributeur » (menu Partager), puis réglez dans Paramètres les onglets visibles et les actions autorisées (modifier, créer, traiter les déclarations, documents, remboursements compta, e-mails, partage Coste Fermon, IA, paramètres). Les types d’accès (Lecture seule, Standard, Comptabilité, Gestionnaire) sont modifiables et vous pouvez en créer d’autres dans Paramètres. Le Balancier et les statistiques Compta se donnent à part, type par type. Les réglages masquent l’interface ; seul l’espace Coste Fermon est verrouillé côté serveur. Les profils à e-mail fictif servent à préparer la liste ; ils ne donnent aucun accès tant que la personne n’est pas invitée.</p>
<h3>Agent IA</h3><p>La fiche propose « Contrôle IA du dossier » ; le contrôle IA relit le dossier ouvert. Il signale erreurs, incohérences et manquements, sans rien modifier : vérifiez toujours avant d’agir.</p>
<h3>Process internes</h3><p>En bas de ce guide, chaque process se présente en fiche imprimable (présentation aide-mémoire, impression, PDF) et peut porter des fichiers ou liens, partageables avec Coste Fermon.</p><h3>Conditions de clôture</h3><p>Un sinistre n’est clos que lorsque toutes ces conditions sont réunies :</p><ul>${CL.map(c=>`<li>${c}</li>`).join('')}</ul></div>${procHtml()}`}

function gateDb(db){const g=(ref,path)=>new Proxy({},{get(_,k){const v=ref[k];if(typeof v!=='function')return v;if(k==='set'||k==='update'||k==='delete')return(...a)=>{if(!GEVT)return safeW(v,ref,a);PEND.set((path||String(a[0]&&a[0].id||Math.random()))+'|'+k,{run:()=>safeW(v,ref,a)});pendBar();setTimeout(()=>{try{toast('Modification en attente : cliquez sur ENREGISTRER')}catch(_){}},0);return new Promise(()=>{})};return v.bind(ref)}});

async function flushPend(){const L=[...PEND];let ko=0;for(const [k,o] of L){try{await o.run();PEND.delete(k)}catch(x){ko++}}pendBar();if(ko)toast(ko+' modification(s) non enregistrée(s)')}
function pendBar(){let b=$('#pdbar');if(!PEND.size){if(b)b.remove();window.onbeforeunload=null;return}
if(!b){b=document.createElement('div');b.id='pdbar';b.setAttribute('popover','manual');document.body.appendChild(b)}window.onbeforeunload=()=>'Modifications non enregistrées';
b.innerHTML='<span><b>'+PEND.size+'</b> modification'+(PEND.size>1?'s':'')+' non enregistrée'+(PEND.size>1?'s':'')+'</span><button type="button" id="pd-x">Annuler</button><button type="button" id="pd-ok" class="p">ENREGISTRER</button>';try{b.hidePopover()}catch(_){}const dl=[...document.querySelectorAll('dialog[open]')].pop(),hs=dl||document.body;if(b.parentNode!==hs)hs.appendChild(b);try{b.showPopover()}catch(_){}}
document.addEventListener('close',()=>{if(PEND.size)setTimeout(pendBar,0)},true);document.addEventListener('click',async e=>{if(e.target.id==='pd-x'){if(confirm('Abandonner les modifications non enregistrées ?')){PEND.clear();window.onbeforeunload=null;location.reload()}return}
if(e.target.id==='pd-ok'){const b=e.target;b.disabled=true;let ko=0;for(const [k,o] of [...PEND]){try{await o.run();PEND.delete(k)}catch(x){ko++}}pendBar();toast(ko?ko+' modification(s) non enregistrée(s)':'Modifications enregistrées')}});
</script></body></html>
